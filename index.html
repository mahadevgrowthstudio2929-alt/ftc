<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FTC | Football Analysis</title>

<meta name="description" content="FTC - Football Analysis and Match Insights. Explore football analysis and join our community.">

<meta name="theme-color" content="#090909">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --black: #080808;
    --grey: #181818;
    --white: #ffffff;
    --silver: #bfc1c5;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    background: #080808;
    color: white;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    padding: 15px;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -2;
    background:
    radial-gradient(ellipse at 50% 25%, #292929 0%, transparent 48%),
    radial-gradient(ellipse at 0% 100%, #191919 0%, transparent 45%),
    #080808;
}

.orb {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: #ffffff;
    filter: blur(150px);
    opacity: .09;
    animation: float 8s ease-in-out infinite alternate;
}

.orb.one {
    top: -100px;
    left: -100px;
}

.orb.two {
    bottom: -130px;
    right: -80px;
    animation-delay: 2s;
}

@keyframes float {
    from { transform: translate(0,0); }
    to { transform: translate(80px,60px); }
}

/* MAIN CARD */

.container {
    width: 100%;
    max-width: 420px;
    position: relative;
}

.card {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 27px;
    padding: 29px 23px 22px;
    background: linear-gradient(
        145deg,
        rgba(42,42,42,.86),
        rgba(13,13,13,.97) 65%
    );
    box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.10);
    text-align: center;
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 20%;
    width: 60%;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        #ffffff,
        transparent
    );
    opacity: .7;
}

/* TOP BADGE */

.top-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 13px;
    border: 1px solid rgba(255,255,255,.17);
    border-radius: 30px;
    background: rgba(255,255,255,.045);
    color: #d7d7d7;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.dot {
    height: 6px;
    width: 6px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 10px white;
}

/* LOGO */

.logo-area {
    margin: 24px auto 17px;
    position: relative;
    width: 130px;
    height: 130px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.logo-ring {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;
    animation: rotate 12s linear infinite;
}

.logo-ring::before {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: white;
    top: 8px;
    left: 24px;
    box-shadow: 0 0 15px white;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

.logo-box {
    width: 108px;
    height: 108px;
    border-radius: 25px;
    background: linear-gradient(145deg,#333,#111);
    border: 1px solid rgba(255,255,255,.24);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow:
        0 0 35px rgba(255,255,255,.10),
        inset 0 0 20px rgba(255,255,255,.05);
    overflow: hidden;
}

.logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 9px;
}

/* BRAND NAME */

.brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 8px;
    padding-left: 8px;
    background: linear-gradient(
        180deg,
        #ffffff 10%,
        #bcbcbc 55%,
        #666666 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 15px rgba(255,255,255,.12));
}

.subtitle {
    margin-top: 7px;
    color: #a9a9a9;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
}

/* DIVIDER */

.divider {
    height: 1px;
    width: 75%;
    margin: 22px auto;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.4),
        transparent
    );
}

/* CONTENT */

.heading {
    font-size: 23px;
    line-height: 1.35;
    font-weight: 800;
    letter-spacing: -.8px;
}

.heading span {
    color: #a7a7a7;
}

.description {
    max-width: 310px;
    margin: 10px auto 20px;
    font-size: 12px;
    line-height: 1.8;
    color: #a5a5a5;
}

/* FEATURES */

.features {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
    margin: 20px 0 24px;
}

.feature {
    padding: 13px 5px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.035);
    border-radius: 12px;
}

.feature-icon {
    font-size: 19px;
    margin-bottom: 8px;
    filter: grayscale(1);
}

.feature-text {
    font-size: 9px;
    color: #d4d4d4;
    font-weight: 700;
    letter-spacing: .5px;
}

/* CTA BUTTON */

.join-btn {
    width: 100%;
    height: 57px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 13px;
    background: linear-gradient(
        110deg,
        #eeeeee,
        #ffffff,
        #c7c7c7
    );
    color: #090909;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    box-shadow:
        0 0 25px rgba(255,255,255,.13),
        0 8px 25px rgba(0,0,0,.35);
    transition: .3s ease;
    font-family: 'Inter', sans-serif;
}

.join-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -110%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.8),
        transparent
    );
    transform: skewX(-20deg);
    animation: shine 3.5s infinite;
}

@keyframes shine {
    0% { left: -110%; }
    50%,100% { left: 150%; }
}

.join-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 35px rgba(255,255,255,.25);
}

.join-btn:active {
    transform: scale(.97);
}

.telegram-icon {
    font-size: 19px;
}

/* FOOTER */

.footer {
    margin-top: 20px;
    font-size: 9px;
    color: #747474;
    letter-spacing: 1px;
    line-height: 1.7;
}

.footer strong {
    color: #c5c5c5;
}

/* PROGRESS BAR */

.progress-track {
    width: 100%;
    height: 3px;
    margin-top: 19px;
    background: rgba(255,255,255,.09);
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0;
    border-radius: 10px;
    background: linear-gradient(
        90deg,
        #777,
        #fff,
        #777
    );
    box-shadow: 0 0 12px white;
    animation: loading 2.5s ease forwards;
}

@keyframes loading {
    to { width: 100%; }
}

/* MOBILE */

@media(max-width:380px) {
    .card {
        padding: 22px 17px 18px;
    }

    .logo-area {
        width: 112px;
        height: 112px;
    }

    .logo-box {
        width: 94px;
        height: 94px;
    }

    .brand {
        font-size: 42px;
    }

    .heading {
        font-size: 21px;
    }

    .features {
        margin: 16px 0 19px;
    }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}

</style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>

<main class="container">

    <div class="card">

        <div class="top-badge">
            <span class="dot"></span>
            FOOTBALL COMMUNITY
        </div>

        <div class="logo-area">
            <div class="logo-ring"></div>

            <div class="logo-box">
                <img
                    src="./logo.png"
                    alt="FTC Official Logo"
                >
            </div>
        </div>

        <h1 class="brand">FTC</h1>

        <p class="subtitle">
            FOOTBALL ANALYSIS
        </p>

        <div class="divider"></div>

        <h2 class="heading">
            THE GAME.<br>
            <span>BEYOND THE GAME.</span>
        </h2>

        <p class="description">
            Explore football match insights,
            game analysis and a community
            built around the beautiful game.
        </p>

        <div class="features">

            <div class="feature">
                <div class="feature-icon">⚽</div>
                <div class="feature-text">
                    MATCH<br>INSIGHTS
                </div>
            </div>

            <div class="feature">
                <div class="feature-icon">◈</div>
                <div class="feature-text">
                    GAME<br>ANALYSIS
                </div>
            </div>

            <div class="feature">
                <div class="feature-icon">✦</div>
                <div class="feature-text">
                    FOOTBALL<br>COMMUNITY
                </div>
            </div>

        </div>

        <button
            type="button"
            class="join-btn"
            id="joinButton"
            aria-label="Join FTC football community"
        >
            <span class="telegram-icon">➤</span>
            JOIN FTC COMMUNITY
            <span>↗</span>
        </button>

        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>

        <div class="footer">
            FOOTBALL ANALYSIS & MATCH INSIGHTS<br>
            <strong>FTC</strong> &nbsp; | &nbsp; FOR INFORMATIONAL PURPOSES
        </div>

    </div>

</main>

</script>

</body>
</html>
